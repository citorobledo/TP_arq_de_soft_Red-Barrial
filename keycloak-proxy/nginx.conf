# Mismo Keycloak, dos puertos (ADR-14):
#   8080 -> red local: la consola de administración (/admin) está bloqueada.
#   8081 -> publicado solo en 127.0.0.1 del servidor: acceso completo.
#   8090 -> NO se publica en el host: es la única entrada del túnel público (ADR-15),
#           con lista de rutas permitidas (denegado por defecto).
#
# Importante: los proxy_set_header se declaran dentro de cada "location /"
# (un location que declara alguno pierde los heredados del server).

resolver 127.0.0.11 valid=10s;   # DNS interno de Docker: tolera reinicios de Keycloak

# Límite de peticiones por IP real del cliente (usado en el puerto 8090).
limit_req_zone $binary_remote_addr zone=entrada:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location ~ ^/admin(/|$) {
        return 403;
    }

    location / {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

server {
    listen 8081;
    server_name _;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

# Entrada pública (ADR-15). Recibe el tráfico del túnel ngrok, que ya terminó HTTPS.
server {
    listen 8090;
    server_name _;

    # IP real del cliente: ngrok la agrega a X-Forwarded-For. Solo se confía en las
    # redes privadas de Docker, así un cliente no puede falsear su IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req zone=entrada burst=50 nodelay;
    limit_req_status 429;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # Las cabeceras se declaran una sola vez acá. Los location de este server NO
    # deben declarar proxy_set_header: si lo hicieran, perderían estas.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For   $remote_addr;

    set $keycloak http://keycloak:8080;
    set $app      http://app:8000;

    # Denegado por defecto: toda ruta nueva debe agregarse acá de forma explícita.
    location / {
        return 404;
    }

    location ~ ^/admin(/|$) {
        return 403;
    }

    # Keycloak: solo login y recursos estáticos del login.
    location ^~ /realms/    { proxy_pass $keycloak; }
    location ^~ /resources/ { proxy_pass $keycloak; }

    # Aplicación.
    location = /            { proxy_pass $app; }
    location ^~ /oidc/      { proxy_pass $app; }
    location ^~ /panel/     { proxy_pass $app; }
    location ^~ /referente/ { proxy_pass $app; }   # vista móvil del referente (a desarrollar)
    location ^~ /static/    { proxy_pass $app; }
}
